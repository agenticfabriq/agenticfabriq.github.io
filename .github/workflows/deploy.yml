name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # `npm run check:samples` imports every sample in its own subprocess, but a
      # sample whose third-party import is missing is reported as a skip rather
      # than checked -- and the skipped set covers most of the coupled pairs the
      # import check exists to catch. So install the EXTERNAL_PACKAGES allowlist
      # from scripts/check-samples.mjs before running it, pinned to the releases
      # the samples say they were written against.
      #
      # crewai 1.15.16 requires openai<3 and openai-agents 0.21.1 requires
      # openai>=3, so pip cannot resolve the two together. They are installed in
      # separate commands, crewai last, because crewai's bound is also inherited
      # by instructor and so satisfying it satisfies two constraints instead of
      # one. Both framework samples import under either resolution -- neither
      # reaches the openai client at import time. pip prints the unsatisfied
      # openai-agents bound as a warning and exits 0.
      #
      # agentic-fabriq-sdk is installed for the same reason even though it does
      # not resolve the skip: at the version on PyPI today it ships neither
      # af_sdk.fabriq_client nor af_sdk.dx, so those samples stay skipped -- but
      # with the package present the checker reports "installed here but exposes
      # no ..." instead of "not installed here", which is the difference between
      # a machine problem and a package problem.
      - name: Install Python sample dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            'agentic-fabriq-sdk' \
            'cryptography' \
            'httpx' \
            'langchain==1.3.15' \
            'langchain-core==1.5.6' \
            'langgraph==1.2.11' \
            'openai-agents==0.21.1' \
            'psycopg[binary]' \
            'pydantic' \
            'PyJWT' \
            'requests'
          pip install 'crewai==1.15.16'
      - run: npm run verify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
